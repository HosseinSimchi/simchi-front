<div class="overflow-hidden h-screen w-screen bg-gray-50">
  <div class="grid grid-rows-[auto_minmax(0,1fr)] grid-cols-12 h-full">
    <!-- Header -->
    <div class="col-span-12">
      <simchi-docs-header />
    </div>

    <!-- Body -->
    <div class="col-span-12 grid grid-cols-12 min-h-0 flex-1">
      <!-- Main Content -->
      <div
        [class]="isSidebarOpen ? 'col-span-10' : 'col-span-11'"
        class="flex flex-col min-h-0 px-[30px]"
      >
        <div class="flex-1 min-h-0 overflow-y-auto pt-[48px] ps-[30px]">
          <router-outlet></router-outlet>
        </div>
      </div>
    </div>
  </div>
</div>
